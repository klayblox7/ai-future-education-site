services:
  - type: web
    name: ai-future-education
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: TZ
        value: Asia/Seoul
    disk:
      name: ai-future-data
      mountPath: /app/data
      sizeGB: 5
